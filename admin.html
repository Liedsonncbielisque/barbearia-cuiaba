<!doctype html><html lang="pt-BR"><meta name="viewport" content="width=device-width"><title>Gestão | Barbearia Cuiabá</title><style>body{margin:0;background:#f5f0e3;font:16px Arial;color:#17191b}.w{width:min(1100px,92%);margin:auto}header{background:#202527;color:white;padding:24px}h1,h2{font-family:Georgia}.card{background:#fffdf8;border:1px solid #ddd;padding:20px;margin:25px 0}.field{margin:10px 0}.field input{width:100%;box-sizing:border-box;padding:11px;margin-top:4px}.btn{border:0;padding:10px 12px;background:#9f2825;color:white;font-weight:bold;cursor:pointer}.dark{background:#202527}.danger{background:#8c3830}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #ddd}.msg{display:none;padding:11px;margin-top:12px}.err{background:#fee2df;color:#8b2020}.ok{background:#dff5e5;color:#125e29}@media(max-width:650px){table{font-size:.8rem}}</style><header><div class="w"><h1>Barbearia Cuiabá · Gestão</h1><p>Agenda e solicitações</p></div></header><main class="w"><section class="card" id="auth"><h2>Acesso administrativo</h2><div class="field">E-mail<input id="email" type="email" value="liedsonbielisque@gmail.com"></div><div class="field">Senha<input id="password" type="password"></div><button class="btn" id="login">ENTRAR</button> <button class="btn dark" id="signup">CRIAR ACESSO</button><div id="msg" class="msg"></div></section><section class="card" id="panel" hidden><button class="btn dark" onclick="load()">ATUALIZAR</button> <button class="btn danger" onclick="db.auth.signOut().then(()=>location.reload())">SAIR</button><h2>Solicitações</h2><div id="list">Carregando...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const url='https://krashkfdrlfoweanuklo.supabase.co',key='sb_publishable_3NSbgEjn9w8GJm2dN2JpzQ_19FhyGer',db=supabase.createClient(url,key),fn=url+'/functions/v1/manage-bookings';function note(t,c){msg.textContent=t;msg.className='msg '+c;msg.style.display='block'}async function load(){let{data:{session}}=await db.auth.getSession();if(!session)return;auth.hidden=true;panel.hidden=false;let r=await fetch(fn,{headers:{Authorization:'Bearer '+session.access_token,apikey:key}}),j=await r.json();if(!r.ok){list.textContent=j.error;return}list.innerHTML='<table><tr><th>Status</th><th>Cliente</th><th>Serviço</th><th>Horário</th><th>Ação</th></tr>'+j.bookings.map(x=>`<tr><td>${x.status}</td><td>${x.customers?.name||''}<br><small>${x.customers?.phone||''}</small></td><td>${x.services?.name||''}</td><td>${new Date(x.starts_at).toLocaleString('pt-BR')}</td><td><button class="btn" onclick="setStatus('${x.id}','confirmed')">Confirmar</button> <button class="btn danger" onclick="setStatus('${x.id}','cancelled')">Cancelar</button></td></tr>`).join('')+'</table>'}async function setStatus(id,status){let{data:{session}}=await db.auth.getSession(),r=await fetch(fn,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:key},body:JSON.stringify({action:'update_status',booking_id:id,status})});if(!r.ok)alert((await r.json()).error);load()}login.onclick=async()=>{let{error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)return note(error.message,'err');load()};signup.onclick=async()=>{let{error}=await db.auth.signUp({email:email.value,password:password.value});note(error?'Erro: '+error.message:'Conta criada. Confirme seu e-mail se solicitado.','ok')};load()</script></html>
